name: Build PelvicFloorAmiri v2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -q PelvicFloorAmiri-v2-Visual.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/PelvicFloorAmiri-v2
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PelvicFloorAmiri-v2-APK
          path: extracted/PelvicFloorAmiri-v2/app/build/outputs/apk/debug/app-debug.apk
